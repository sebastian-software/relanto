name: Frage stellen
description: Stelle eine konkrete Frage zur Nutzung oder zur Mitarbeit.
title: "[Frage]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Lies zuerst `SUPPORT.md` und die Dokumentation. Wenn in diesem Repository Discussions aktiviert sind, stelle deine Frage bitte dort.

  - type: textarea
    id: question
    attributes:
      label: Frage
      description: Was möchtest du erreichen, und wo kommst du nicht weiter?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Kontext
      description: Der betroffene Befehl oder API-Aufruf, die Version und die zugehörige Dokumentationsseite. Entferne Zugangsdaten und private Daten.
