name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: "Guard: agent step not yet completed for this PR"
        run: test ! -f .standards/pending.json

      # Single source of truth for the check steps: agent:check:ci runs the same
      # lint/format:check/typecheck/build/test chain as the local agent:check, so
      # CI and local runs can never diverge.
      - run: pnpm agent:check:ci

      - name: Guard standard source and build asset boundary
        shell: bash
        run: |
          set -euo pipefail

          scoped_asset_package_pattern='@[[:alnum:]._-]+/assets'
          operator_font_pattern='(Sa''ns|Ser''if|Sl''ab)'

          if git grep -n -E "${scoped_asset_package_pattern}" -- \
            Dockerfile \
            .github/workflows \
            scripts \
            package.json \
            pnpm-lock.yaml \
            packages/frontend/package.json \
            packages/frontend/app; then
            echo "::error::Tracked executable source still references the private asset package."
            exit 1
          fi

          if git grep -n -E "${operator_font_pattern}" -- \
            Dockerfile \
            .github/workflows \
            scripts \
            packages/frontend/app; then
            echo "::error::Tracked executable source still contains a proprietary font-family marker."
            exit 1
          fi

          tracked_fonts="$(git ls-files -- packages/frontend | grep -Ei '\.(woff2?|ttf|otf)$' || true)"
          if [ -n "${tracked_fonts}" ]; then
            echo "::error::Tracked font binaries are not allowed in the standard distribution."
            printf '%s\n' "${tracked_fonts}"
            exit 1
          fi

          # The standard build is intentionally font-free. A future approved
          # open font must update this guard and the public asset notice in the
          # same change instead of weakening this assertion silently.
          build_font="$(find packages/frontend/build/client -type f \( \
            -iname '*.woff' -o \
            -iname '*.woff2' -o \
            -iname '*.ttf' -o \
            -iname '*.otf' \
          \) -print -quit)"
          if [ -n "${build_font}" ]; then
            echo "::error::Standard client build contains a font binary: ${build_font}"
            exit 1
          fi

          if grep -R -I -n -E "${scoped_asset_package_pattern}" packages/frontend/build; then
            echo "::error::Standard server or client build contains the private package marker."
            exit 1
          fi

          if grep -R -I -n -E "${operator_font_pattern}" packages/frontend/build; then
            echo "::error::Standard server or client build contains a proprietary font-family marker."
            exit 1
          fi

          if [ -e packages/frontend/build/client/operator-assets ]; then
            echo "::error::Standard build must not contain an operator-assets directory."
            exit 1
          fi

      - name: Coverage (enforces thresholds)
        run: pnpm run --if-present test:coverage

      # minimum-release-age=0: pnpm 11 holds back versions <24h old, so without
      # it `check` resolves a stale standards CLI while the stamp was written by
      # apply against the true latest — a freshly released version reads as false
      # drift. Mirrors the apply invocation in renovate-config/standards.json.
      - run: pnpm --config.minimum-release-age=0 dlx @sebastian-software/standards check

      # SCA gate for production dependencies (e.g. nodemailer, better-sqlite3,
      # openid-client). --prod scopes the scan to shipped code so dev-tooling
      # advisories never block a PR. --audit-level=high fails only on high and
      # critical CVEs; low/moderate advisories stay non-blocking so routine
      # Renovate churn keeps CI actionable rather than perpetually red.
      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level high

  container:
    # Build the container image on a Docker-capable GitHub-hosted runner (the
    # self-hosted runners only handle non-Docker jobs) so a broken Dockerfile or
    # an image that crashes on boot fails the pull request instead of surfacing
    # only at release time. Mirrors the build in release-please.yml but never
    # pushes.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          build-args: |
            RELANTO_GIT_SHORT_SHA=${{ github.sha }}
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          provenance: false
          push: false
          tags: relanto:smoke-test

      # Scan the freshly built image (OS packages + bundled node_modules) for
      # known CVEs before it is ever a release candidate. Nothing is pushed
      # here, so this is the last gate that inspects the actual image contents.
      # exit-code=1 fails the job; severity is capped at HIGH/CRITICAL to match
      # the pnpm audit gate in `check` and avoid noise from low/medium findings.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: relanto:smoke-test
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          # Suppress specific, separately-tracked findings (see .trivyignore).
          trivyignores: .trivyignore

      - name: Smoke-test the standard container image
        run: ./scripts/smoke-test-container.sh relanto:smoke-test

      - name: Smoke-test the operator-assets fixture
        env:
          SMOKE_TEST_OPERATOR_ASSETS_FIXTURE: "true"
        run: ./scripts/smoke-test-container.sh relanto:smoke-test
