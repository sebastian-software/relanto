name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: "Guard: agent step not yet completed for this PR"
        run: test ! -f .standards/pending.json

      - name: "Guard: no blocking agent findings for this PR"
        run: |
          node -e "
          const { existsSync, readFileSync } = require('node:fs');
          const file = '.standards/blocked.json';
          if (!existsSync(file)) { process.exit(0); }
          const raw = readFileSync(file, 'utf8');
          console.log(raw);
          const fail = (detail) => { console.error('Refusing to pass ' + file + ': ' + detail); process.exit(1); };
          let state;
          try { state = JSON.parse(raw); } catch (error) { fail('it is not valid JSON - ' + error.message); }
          if (typeof state !== 'object' || state === null || Array.isArray(state)) { fail('it is not a JSON object.'); }
          const orNull = (value, type) => value === null || typeof value === type;
          const broken = [
            ['schemaVersion must be 1', state.schemaVersion !== 1],
            ['blocking must be a boolean', typeof state.blocking !== 'boolean'],
            ['reason must be a string', typeof state.reason !== 'string'],
            ['detectedAt must be a string', typeof state.detectedAt !== 'string'],
            ['expectedStandardsVersion must be a number', typeof state.expectedStandardsVersion !== 'number'],
            ['observedStandardsVersion must be a number or null', !orNull(state.observedStandardsVersion, 'number')],
            ['expectedCliVersion must be a string or null', !orNull(state.expectedCliVersion, 'string')],
            ['observedCliVersion must be a string or null', !orNull(state.observedCliVersion, 'string')],
            ['failedChecks must be an array of strings', !Array.isArray(state.failedChecks) || !state.failedChecks.every((entry) => typeof entry === 'string')],
            ['retry must be a string', typeof state.retry !== 'string'],
          ].filter((entry) => entry[1]).map((entry) => entry[0]);
          if (broken.length > 0) { fail('it does not match the documented schema - ' + broken.join('; ')); }
          if (state.blocking) { fail('the agent could not validate its result.'); }
          console.log('The agent marker is non-blocking; its findings are reviewer context.');
          "

      # Single source of truth for the check steps: agent:check:ci runs the same
      # lint/format:check/typecheck/build/test chain as the local agent:check, so
      # CI and local runs can never diverge.
      - run: pnpm agent:check:ci

      # Static release contract lives outside the standards-managed agent:check
      # chain, so it is invoked explicitly here.
      - name: Verify container release contract
        run: pnpm test:container-release-contract

      - name: Guard standard source and build asset boundary
        shell: bash
        run: |
          set -euo pipefail

          scoped_asset_package_pattern='@[[:alnum:]._-]+/assets'
          operator_font_pattern='(Sa''ns|Ser''if|Sl''ab)'

          if git grep -n -E "${scoped_asset_package_pattern}" -- \
            Dockerfile \
            .github/workflows \
            scripts \
            package.json \
            pnpm-lock.yaml \
            packages/frontend/package.json \
            packages/frontend/app; then
            echo "::error::Tracked executable source still references the private asset package."
            exit 1
          fi

          if git grep -n -E "${operator_font_pattern}" -- \
            Dockerfile \
            .github/workflows \
            scripts \
            packages/frontend/app; then
            echo "::error::Tracked executable source still contains a proprietary font-family marker."
            exit 1
          fi

          tracked_fonts="$(git ls-files -- packages/frontend | grep -Ei '\.(woff2?|ttf|otf)$' || true)"
          if [ -n "${tracked_fonts}" ]; then
            echo "::error::Tracked font binaries are not allowed in the standard distribution."
            printf '%s\n' "${tracked_fonts}"
            exit 1
          fi

          # The standard build is intentionally font-free. A future approved
          # open font must update this guard and the public asset notice in the
          # same change instead of weakening this assertion silently.
          build_font="$(find packages/frontend/build/client -type f \( \
            -iname '*.woff' -o \
            -iname '*.woff2' -o \
            -iname '*.ttf' -o \
            -iname '*.otf' \
          \) -print -quit)"
          if [ -n "${build_font}" ]; then
            echo "::error::Standard client build contains a font binary: ${build_font}"
            exit 1
          fi

          if grep -R -I -n -E "${scoped_asset_package_pattern}" packages/frontend/build; then
            echo "::error::Standard server or client build contains the private package marker."
            exit 1
          fi

          if grep -R -I -n -E "${operator_font_pattern}" packages/frontend/build; then
            echo "::error::Standard server or client build contains a proprietary font-family marker."
            exit 1
          fi

          if [ -e packages/frontend/build/client/operator-assets ]; then
            echo "::error::Standard build must not contain an operator-assets directory."
            exit 1
          fi

      - name: Coverage (enforces thresholds)
        run: pnpm run --if-present test:coverage

      - name: "Guard: the pinned standards CLI matches the repository stamp"
        run: |
          node -p "
          const meta = require('./.repometa.json');
          const paths = [process.cwd(), ...(meta.workspaces ?? [])];
          const manifest = require(require.resolve('@sebastian-software/standards/manifest.json', { paths }));
          if (manifest.currentVersion !== meta.standards) {
            throw new Error('The installed @sebastian-software/standards ships manifest version ' + manifest.currentVersion + ', but .repometa.json is stamped ' + meta.standards + '. Raise the pin to the release whose manifest is version ' + meta.standards + ' and refresh the lockfile.');
          }
          'standards CLI and repository stamp are aligned at version ' + meta.standards
          "

      - run: pnpm exec standards check

      # SCA gate for production dependencies (e.g. nodemailer, better-sqlite3,
      # openid-client). --prod scopes the scan to shipped code so dev-tooling
      # advisories never block a PR. --audit-level=high fails only on high and
      # critical CVEs; low/moderate advisories stay non-blocking so routine
      # Renovate churn keeps CI actionable rather than perpetually red.
      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level high

  container:
    # Build the container image on a Docker-capable GitHub-hosted runner so a
    # broken Dockerfile or an image that crashes on boot fails the pull request
    # instead of surfacing only at release time. Mirrors the build in
    # release-please.yml but never pushes.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Create protected container-boundary canaries
        shell: bash
        run: |
          set -euo pipefail
          openssl rand -hex 32 > packages/frontend/.env.context-canary
          openssl rand -hex 32 > packages/frontend/.relanto-runtime-canary
          chmod 600 \
            packages/frontend/.env.context-canary \
            packages/frontend/.relanto-runtime-canary
          sed 's/^/::add-mask::/' packages/frontend/.env.context-canary
          sed 's/^/::add-mask::/' packages/frontend/.relanto-runtime-canary

      - name: Prove excluded files never enter the build context
        run: docker buildx build --platform linux/amd64 --target context-probe .

      - name: Prove runtime deploy excludes the build-stage canary
        run: |
          docker buildx build \
            --build-arg RELANTO_GIT_SHORT_SHA="${GITHUB_SHA}" \
            --platform linux/amd64 \
            --target runtime-probe \
            .

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          build-args: |
            RELANTO_GIT_SHORT_SHA=${{ github.sha }}
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          provenance: false
          push: false
          tags: relanto:smoke-test

      - name: Verify final image inventory and metadata
        run: |
          ./scripts/verify-container-image.sh \
            relanto:smoke-test \
            packages/frontend/.relanto-runtime-canary

      # Scan the freshly built image (OS packages + bundled node_modules) for
      # known CVEs before it is ever a release candidate. Nothing is pushed
      # here, so this is the last gate that inspects the actual image contents.
      # exit-code=1 fails the job; severity is capped at HIGH/CRITICAL to match
      # the pnpm audit gate in `check` and avoid noise from low/medium findings.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: relanto:smoke-test
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          # Suppress specific, separately-tracked findings (see .trivyignore).
          trivyignores: .trivyignore

      - name: Smoke-test the standard container image
        run: ./scripts/smoke-test-container.sh relanto:smoke-test

      - name: Smoke-test the operator-assets fixture
        env:
          SMOKE_TEST_OPERATOR_ASSETS_FIXTURE: "true"
        run: ./scripts/smoke-test-container.sh relanto:smoke-test

      # Non-publishing pre-merge release archive gate. It builds one
      # linux/amd64 OCI archive exactly like the release build (BuildKit reuses
      # the cache of the image build above) and runs the same
      # scripts/verify-release-archive.sh as release-please.yml: Trivy positive
      # control, secret scan of the unpacked archive and a skopeo
      # --preserve-digests/--digestfile proof into a local OCI layout. No
      # registry login, no push, no docker socket mount.
      - name: Build the linux/amd64 release OCI archive (no push)
        uses: docker/build-push-action@v7
        with:
          build-args: |
            RELANTO_GIT_SHORT_SHA=${{ github.sha }}
          context: .
          file: ./Dockerfile
          outputs: type=oci,dest=relanto-release.oci.tar
          platforms: linux/amd64
          provenance: false
          push: false
          tags: relanto:ci-${{ github.run_id }}

      - name: Prepare harmless Trivy bootstrap target
        run: mkdir .trivy-bootstrap-empty

      - name: Install pinned Trivy CLI
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: true
          exit-code: 1
          hide-progress: true
          scan-ref: .trivy-bootstrap-empty
          scan-type: fs
          scanners: secret
          version: v0.70.0

      # Same digest-pinned Skopeo image as release-please.yml, so both gates
      # run Skopeo 1.22.2 instead of the runner image's older package.
      - name: Prove release archive secret scan and digest preservation
        env:
          RELEASE_TAG: ci-${{ github.run_id }}
          SKOPEO_IMAGE: quay.io/skopeo/stable@sha256:4a16d57b37617a04b3d643079a477a2848efe892dffcdf0ce56df4262b65f810
        run: ./scripts/verify-release-archive.sh relanto-release.oci.tar "${RELEASE_TAG}"
